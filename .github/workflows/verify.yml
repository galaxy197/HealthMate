name: Verify local source
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check changed Dart formatting
        run: node tool/check_changed_dart_format.cjs
        env:
          HEALTHMATE_FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --concurrency=2 --reporter expanded
      - run: npm ci --prefix admin-web
      - run: npm ci --prefix chat-api
      - run: npm test --prefix admin-web
      - run: npm run check --prefix admin-web
      - run: npm test --prefix chat-api
      - run: npm run check --prefix chat-api
      - run: node --test tool/*.test.cjs
      - run: node tool/audit_source_secrets.cjs
      - run: git diff --check
  emulators:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: npm ci --prefix rules-tests
      - run: npm ci --prefix chat-api
      - run: npm install --global firebase-tools@15.22.4
      - name: Rules and real SDK regression on local demo
        run: firebase emulators:exec --config firebase.emulators.json --only auth,firestore --project demo-healthmate-rules "node tool/ci_emulator_checks.cjs"
        env:
          CHROME_EXECUTABLE: /usr/bin/google-chrome
      - name: Admin real SDK regression on isolated local demo
        run: firebase emulators:exec --config firebase.admin-emulators.json --only auth,firestore --project demo-healthmate-admin "node admin-web/seed-emulators.mjs --extended && node --test admin-web/test/sdk.integration.mjs"
